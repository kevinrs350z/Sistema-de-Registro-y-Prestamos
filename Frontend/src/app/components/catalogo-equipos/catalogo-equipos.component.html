<div class="catalogo-expedia">
  <!-- ======== ENCABEZADO ======== -->
  <h1>Selecciona los equipos</h1>
  <p class="sub">
    Agrega equipos al carrito antes de continuar con la reserva.
  </p>

  <!-- ======== BARRA SUPERIOR (categorías + búsqueda) ======== -->
  <div class="barra-categorias">
    <!-- CATEGORÍAS -->
    <div class="categorias">
      <button
        *ngFor="let c of categorias()"
        (click)="categoriaSeleccionada.set(c)"
        [class.active]="categoriaSeleccionada() === c"
      >
        {{ c }}
      </button>
    </div>

    <!-- BUSCADOR -->
    <div class="busqueda">
      <input
        type="text"
        placeholder="Buscar un equipo..."
        [value]="busqueda()"
        (input)="filtrarPorBusqueda($event)"
      />
      <button title="Buscar">
        <i class="bi bi-search"></i>
      </button>
    </div>
  </div>

  <!-- ======== GRID DE EQUIPOS ======== -->
  <div class="grid-equipos">
    <div
      *ngFor="let e of equiposFiltrados()"
      class="card-equipo"
      [class.selected]="carrito().includes(e.idEquipo)"
    >
      <!-- Imagen -->
      <img
        [src]="'https://via.placeholder.com/300x180?text=' + e.nombre"
        alt="foto equipo"
      />

      <!-- Contenido -->
      <div class="contenido-card">
        <h3>{{ e.nombre }}</h3>
        <p class="cat">{{ e.categoria }}</p>
        <p class="code">Código: {{ e.codigo }}</p>
      </div>

      <!-- Botón de acción -->
      <button (click)="toggleEquipo(e.idEquipo)">
        {{ carrito().includes(e.idEquipo)
          ? 'Quitar del carrito'
          : 'Agregar al carrito' }}
      </button>
    </div>
  </div>

  <!-- ======== BOTÓN CONTINUAR ======== -->
  <div class="acciones">
    <button
      [disabled]="carrito().length === 0"
      (click)="continuarReserva()"
    >
      Continuar con {{ carrito().length }} equipo(s) seleccionado(s) →
    </button>
  </div>
</div>
