<div class="catalogo-wrap">
  <h1>Selecciona los equipos</h1>
  <p class="sub">Agrega equipos al carrito antes de continuar con la reserva.</p>

  <!-- Filtros por categoría -->
  <div class="filtros">
    <button
      *ngFor="let c of categorias()"
      (click)="categoriaSeleccionada.set(c)"
      [class.active]="categoriaSeleccionada() === c"
    >
      {{c}}
    </button>
  </div>

  <!-- Lista de equipos -->
  <div class="grid-equipos">
    <div *ngFor="let e of equiposFiltrados()" class="card-equipo">
      <img [src]="'https://via.placeholder.com/300x180?text=' + e.nombre" alt="foto equipo">
      <h3>{{e.nombre}}</h3>
      <p class="cat">{{e.categoria}}</p>
      <p class="code">Código: {{e.codigo}}</p>
      <button (click)="toggleEquipo(e.idEquipo)">
        {{ carrito().includes(e.idEquipo) ? 'Quitar del carrito' : 'Agregar al carrito' }}
      </button>
    </div>
  </div>

  <!-- Botón continuar -->
  <div class="acciones">
    <button [disabled]="carrito().length === 0" (click)="continuarReserva()">
      Continuar con {{carrito().length}} equipo(s) seleccionados →
    </button>
  </div>
</div>
