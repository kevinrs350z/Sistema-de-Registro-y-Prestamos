<nav class="navbar-uta admin-navbar" [class.menu-open]="menuAbierto">
  <div class="navbar-bg"></div>

  <div class="navbar-content">
    <div
      class="navbar-brand"
      role="button"
      tabindex="0"
      (click)="irHome()"
      (keyup.enter)="irHome()"
      aria-label="Ir al dashboard"
    >
      <img
        src="assets/logo-carrera-white.png"
        alt="Diseño Multimedia"
        class="logo-carrera"
      />
    </div>

    <div class="navbar-admin-tools">
      <button
        type="button"
        class="navbar-toggler"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuAbierto"
        aria-label="Abrir menú"
      >
        <span class="toggler-icon"></span>
        <span class="toggler-icon"></span>
        <span class="toggler-icon"></span>
      </button>

      <span class="nav-separator">|</span>
      <span class="nav-user-name">{{ getUserId() }}</span>
      <a
        href="javascript:void(0)"
        class="nav-link nav-logout"
        (click)="cerrarSesion()"
      >
        <i class="bi bi-box-arrow-right"></i>
        Salir
      </a>
    </div>
  </div>

  <div class="navbar-collapse admin-menu" [class.show]="menuAbierto">
    <button class="nav-link-mobile" (click)="navegarInterno('gestionar')">
      Panel de administración
    </button>
    <button class="nav-link-mobile" (click)="navegarInterno('solicitudes')">
      Solicitudes pendientes
    </button>
    <button class="nav-link-mobile" (click)="navegarInterno('finalizadas')">
      Solicitudes finalizadas
    </button>
    <button class="nav-link-mobile" (click)="navegarInterno('inventario')">
      Gestionar Equipos
    </button>
    <button class="nav-link-mobile" (click)="navegarInterno('cuentas')">
      Gestionar Cuentas
    </button>
    <button class="nav-link-mobile" (click)="navegarInterno('asignaturas')">
      Gestionar Asignaturas / Eventos
    </button>
    <button class="nav-link-mobile" (click)="irCrearSolicitud()">
      Crear solicitud
    </button>
    <button class="nav-link-mobile" (click)="irBloqueosHorario()">
      Bloqueos de horario
    </button>
    <button class="nav-link-mobile" (click)="irCategorias()">
      Gestionar Categorias
    </button>
    <button
      class="nav-link-mobile"
      *ngIf="auth.isAdmin()"
      (click)="irReportes()"
    >
      Visualizar Reportes
    </button>
  </div>
</nav>
