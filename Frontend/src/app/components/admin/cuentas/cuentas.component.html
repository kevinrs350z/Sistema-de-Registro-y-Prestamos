<div class="cuentas-container">

  <!-- LISTA IZQUIERDA -->
  <div class="lista">
    <h3 class="titulo-lista">Alumnos Registrados</h3>

    <button class="btn-crear" (click)="comenzarCrear()">+ Crear cuenta</button>

    <input
      type="text"
      class="buscador"
      placeholder="Buscar alumno..."
      [(ngModel)]="filtro"
    />

    <div
      class="item"
      *ngFor="let a of alumnosFiltrados"
      (click)="seleccionar(a)"
      [class.activo]="a === alumnoSeleccionado"
    >
      <h4>{{ a.nombre }}</h4>
      <p>{{ a.email }}</p>
    </div>

    <p *ngIf="alumnos.length === 0" class="sin-alumnos">
      No hay alumnos registrados.
    </p>

      <div class="paginacion" style="margin-top: 20px; text-align:center;">
      <button 
        (click)="paginaAnterior()" 
        [disabled]="currentPage === 1"
        style="padding: 8px 12px; margin-right: 10px;">
        ◀ Anterior
      </button>

      <span style="font-weight: bold;">
        Página {{ currentPage }} de {{ lastPage }}
      </span>

      <button 
        (click)="paginaSiguiente()" 
        [disabled]="currentPage === lastPage"
        style="padding: 8px 12px; margin-left: 10px;">
        Siguiente ▶
      </button>
    </div>
  </div>

  <!-- PANEL DERECHO -->
  <div class="detalle" *ngIf="alumnoSeleccionado || creando">

    <!-- PANEL DE CREACIÓN -->
    <div *ngIf="creando">
      <h3>Crear Nueva Cuenta</h3>

      <label>Nombre:</label>
      <input type="text" [(ngModel)]="nuevoAlumno.nombre" />

      <!-- NUEVO -->
      <label>Apellido 1:</label>
      <input type="text" [(ngModel)]="nuevoAlumno.apellido1" />

      <!-- NUEVO -->
      <label>Apellido 2:</label>
      <input type="text" [(ngModel)]="nuevoAlumno.apellido2" />

      <label>Email:</label>
      <input type="email" [(ngModel)]="nuevoAlumno.email" />

      <label>RUT:</label>
      <input type="text" [(ngModel)]="nuevoAlumno.rut" />

      <label>Teléfono:</label>
      <input type="text" [(ngModel)]="nuevoAlumno.telefono" />

      <label>Contraseña:</label>
      <input type="password" [(ngModel)]="nuevoAlumno.password" />

      <label>Confirmar contraseña:</label>
      <input type="password" />

      <!-- NUEVO: selector de rol -->
      <label>Rol:</label>
      <select [(ngModel)]="nuevoAlumno.rol">
        <option value="Alumno">Alumno</option>
        <option value="Admin">Admin</option>
      </select>

      <div class="acciones">
        <button class="btn-guardar" (click)="crearCuenta()">Crear cuenta</button>
        <button class="btn-cancelar" (click)="creando=false">Cancelar</button>
      </div>
    </div>



    <!-- PANEL DE EDICIÓN -->
    <div *ngIf="alumnoSeleccionado && !creando">
      <h3>Datos del Alumno</h3>

      <label>Nombre:</label>
      <input
        type="text"
        [(ngModel)]="alumnoSeleccionado.nombre"
        [disabled]="!editMode"
      />

      
      <label>Apellido 1:</label>
      <input
        type="text"
        [(ngModel)]="alumnoSeleccionado.apellido1"
        [disabled]="!editMode"
      />

      
      <label>Apellido 2:</label>
      <input
        type="text"
        [(ngModel)]="alumnoSeleccionado.apellido2"
        [disabled]="!editMode"
      />

      <label>Email:</label>
      <input
        type="email"
        [(ngModel)]="alumnoSeleccionado.email"
        [disabled]="!editMode"
      />

      <label>RUT:</label>
      <input
        type="text"
        [(ngModel)]="alumnoSeleccionado.rut"
        [disabled]="!editMode"
      />

      <label>Teléfono:</label>
      <input
        type="text"
        [(ngModel)]="alumnoSeleccionado.telefono"
        [disabled]="!editMode"
      />



      <label>Contraseña:</label>
      <input type="password" value="********" disabled />
         
      <label>Rol:</label>
      <select [(ngModel)]="alumnoSeleccionado.rol" [disabled]="!editMode">
        <option value="Alumno">Alumno</option>
        <option value="Admin">Admin</option>
      </select>

      <div class="acciones">
        <button class="btn-editar" *ngIf="!editMode" (click)="editar()">Editar datos</button>
        <button class="btn-guardar" *ngIf="editMode" (click)="guardar()">Guardar</button>
        <button class="btn-cancelar" *ngIf="editMode" (click)="editMode=false">Cancelar</button>
      </div>
    </div>

  </div>

  

</div>
