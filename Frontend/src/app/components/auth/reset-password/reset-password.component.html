<div class="reset-page">
  <div class="reset-card">
    <div class="reset-header text-center">
      <i class="bi bi-lock-fill icono-header"></i>
      <h1>Restablecer Contraseña</h1>
      <p class="sub">Introduce tu nueva contraseña para continuar</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="reset-form">
      <div class="form-group">
        <label for="password">Nueva Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="••••••••"
          class="form-control"
        />
      </div>

      <button type="submit" class="btn btn-primary btn-reset" [disabled]="loading || form.invalid">
        <i class="bi bi-arrow-repeat me-2"></i>
        {{ loading ? 'Procesando...' : 'Actualizar Contraseña' }}
      </button>

      <div class="message success" *ngIf="successMessage">
        <i class="bi bi-check-circle me-1"></i> {{ successMessage }}
      </div>
      <div class="message error" *ngIf="errorMessage">
        <i class="bi bi-x-circle me-1"></i> {{ errorMessage }}
      </div>
    </form>
  </div>
</div>
