<div class="faq-wrapper">

  <header class="faq-header">
    <h1>Preguntas frecuentes</h1>
    <p>Resuelve tus dudas sobre el sistema de préstamos.</p>
  </header>

  <div class="faq-lista">
    <div
      class="faq-card"
      *ngFor="let p of preguntas; let i = index"
      [class.activa]="activa() === i"
      (click)="toggle(i)"
      tabindex="0"
      (keyup.enter)="toggle(i)"
    >
      <div class="faq-header-row">
        <span class="faq-pregunta">{{ p.pregunta }}</span>
      </div>
      <div class="faq-respuesta" *ngIf="activa() === i">
        {{ p.respuesta }}
      </div>
    </div>
  </div>

</div>
