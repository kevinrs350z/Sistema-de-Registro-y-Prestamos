<div class="faq-wrapper">

  <header class="faq-header">
    <h1>Preguntas frecuentes</h1>
    <p>Resuelve tus dudas sobre el sistema de préstamos.</p>
  </header>

  <div class="faq-lista">
    <div class="faq-card" *ngFor="let p of preguntas; let i = index" [class.activa]="activa() === i">
      <button type="button" class="faq-trigger" (click)="toggle(i)">
        <span class="faq-pregunta">{{ p.pregunta }}</span>
        <span class="faq-icon">{{ activa() === i ? '–' : '+' }}</span>
      </button>
      <div class="faq-respuesta" *ngIf="activa() === i">
        {{ p.respuesta }}
      </div>
    </div>
  </div>

</div>
