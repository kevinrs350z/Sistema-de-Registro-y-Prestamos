<nav class="navbar-uta" [class.menu-open]="menuAbierto">
  <!-- Fondo institucional con overlay -->
  <div class="navbar-bg"></div>
  
  <div class="navbar-content">
    <!-- Logos UTA a la izquierda -->
    <div class="navbar-brand">
      <!-- Logo institucional UTA -->
      <img 
        src="assets/logo-uta-white.png" 
        alt="Universidad de Tarapacá" 
        class="logo-uta"
      />
      <!-- Logo carrera Diseño Multimedia -->
      <img 
        src="assets/logo-carrera-white.png" 
        alt="Diseño Multimedia" 
        class="logo-carrera"
      />
    </div>

    <!-- Menú principal a la derecha (desktop) -->
    <div class="navbar-menu" *ngIf="!esAdmin">
      <a 
        routerLink="/equipos/catalogo" 
        routerLinkActive="active"
        class="nav-link"
      >
        Inicio
      </a>
      <a 
        routerLink="/mis-solicitudes" 
        routerLinkActive="active"
        class="nav-link"
      >
        Mis Solicitudes
      </a>
      <a 
        routerLink="/preguntas-frecuentes" 
        routerLinkActive="active"
        class="nav-link"
      >
        Preguntas Frecuentes
      </a>
      <span class="nav-separator">|</span>
      <span class="nav-user-name">{{ getUserId() }}</span>
      <a 
        href="javascript:void(0)"
        class="nav-link nav-logout"
        (click)="cerrarSesion()"
      >
        <i class="bi bi-box-arrow-right"></i>
        Salir
      </a>
    </div>

    <!-- Botón hamburguesa (móvil) -->
    <button 
      type="button"
      class="navbar-toggler"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuAbierto"
      aria-label="Abrir menú"
      *ngIf="!esAdmin"
    >
      <span class="toggler-icon"></span>
      <span class="toggler-icon"></span>
      <span class="toggler-icon"></span>
    </button>
  </div>

  <!-- Menú móvil colapsable -->
  <div class="navbar-collapse" [class.show]="menuAbierto" *ngIf="!esAdmin">
    <a 
      routerLink="/equipos/catalogo" 
      routerLinkActive="active"
      class="nav-link-mobile"
      (click)="menuAbierto = false"
    >
      Inicio
    </a>
    <a 
      routerLink="/mis-solicitudes" 
      routerLinkActive="active"
      class="nav-link-mobile"
      (click)="menuAbierto = false"
    >
      Mis Solicitudes
    </a>
    <a 
      routerLink="/preguntas-frecuentes" 
      routerLinkActive="active"
      class="nav-link-mobile"
      (click)="menuAbierto = false"
    >
      Preguntas Frecuentes
    </a>
    <div class="nav-mobile-footer">
      <span class="nav-user-mobile">{{ getUserId() }}</span>
      <a 
        href="javascript:void(0)"
        class="nav-link-mobile nav-logout-mobile"
        (click)="cerrarSesion()"
      >
        <i class="bi bi-box-arrow-right"></i>
        Salir
      </a>
    </div>
  </div>
</nav>
