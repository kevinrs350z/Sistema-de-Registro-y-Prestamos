<nav class="navbar navbar-mobile" [class.menu-open]="menuAbierto && !esAdmin">
  <div class="navbar-top">
    <div class="nav-controls">
      <button
        type="button"
        class="menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuAbierto"
        aria-label="Menú"
        [disabled]="esAdmin"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <button
        type="button"
        class="home-btn"
        (click)="irCatalogo()"
        aria-label="Inicio"
      >
        <span class="home-icon"></span>
      </button>
    </div>

    <div class="logo">
      <span class="logo-title">Registro y Préstamos Diseño Multimedia</span>
    </div>

    <div class="nav-spacer" aria-hidden="true"></div>
  </div>

  <div class="nav-dropdown" *ngIf="!esAdmin">
    <div class="dropdown-panel" [class.visible]="menuAbierto">
      <a
        routerLink="/equipos/catalogo"
        routerLinkActive="active"
        class="dropdown-btn"
        (click)="menuAbierto = false"
      >
        Solicitar equipo
      </a>

      <a
        routerLink="/mis-solicitudes"
        routerLinkActive="active"
        class="dropdown-btn"
        (click)="menuAbierto = false"
      >
        Mis solicitudes
      </a>

      <a
        routerLink="/preguntas-frecuentes"
        routerLinkActive="active"
        class="dropdown-btn"
        (click)="menuAbierto = false"
      >
        Preguntas frecuentes
      </a>

      <button
        type="button"
        class="dropdown-btn logout"
        (click)="cerrarSesion()"
      >
        Cerrar sesión
      </button>
    </div>
  </div>
</nav>
