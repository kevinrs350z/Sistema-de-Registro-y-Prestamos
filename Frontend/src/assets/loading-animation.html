<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading — Diseño Multimedia</title>
<style>
  /* ─────────────────────────────────────────────
     "dm" logo reveal  ·  Handwritten stroke trace
     Minimal black bg  ·  White stroke  ·  Continuous
     ───────────────────────────────────────────── */

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo-svg {
    width: 180px;
    height: 110px;
    overflow: visible;
    filter: drop-shadow(0 0 0px rgba(255,255,255,0));
    animation: glow-in .6s ease 2.6s forwards;
  }

  /* ── The continuous "dm" path ── */
  .dm-stroke {
    fill: none;
    stroke: #fff;
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: trace 2.4s cubic-bezier(0.45, 0, 0.15, 1) 0.3s forwards;
  }

  /* ── Keyframes ── */
  @keyframes trace {
    to { stroke-dashoffset: 0; }
  }

  @keyframes glow-in {
    to { filter: drop-shadow(0 0 8px rgba(255,255,255,0.15)); }
  }

  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.55; }
  }

  @keyframes fadeUp {
    to { opacity: 0.6; transform: translateY(0); }
  }

  /* ── After draw completes, gentle loop ── */
  .logo-wrap {
    animation: breathe 3.5s ease-in-out 3.6s infinite;
  }

  /* ── Text ── */
  .logo-text {
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #fff;
    font-weight: 300;
    margin-top: 22px;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp .8s ease 2.8s forwards;
  }

  /* ── Accessibility ── */
  @media (prefers-reduced-motion: reduce) {
    .dm-stroke  { animation: none !important; stroke-dashoffset: 0; }
    .logo-svg   { animation: none !important; filter: none; }
    .logo-text  { animation: none !important; opacity: .6; transform: none; }
    .logo-wrap  { animation: none !important; }
  }

  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0;
    margin: -1px; overflow: hidden; clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }
</style>
</head>
<body>

<div class="logo-wrap" role="status" aria-label="Cargando">

  <svg class="logo-svg" viewBox="0 0 170 100" xmlns="http://www.w3.org/2000/svg">
    <!-- "dm" drawn as one continuous handwritten stroke -->
    <path class="dm-stroke"
          d="M 30,74
             C 14,66 8,42 20,28
             C 32,14 52,22 54,42
             C 55,50 52,64 44,74
             L 54,42
             L 54,12
             C 54,8 56,8 56,12
             L 56,78
             C 62,50 74,36 88,36
             C 102,36 104,54 102,78
             C 106,50 116,36 130,36
             C 144,36 146,54 142,78"
          pathLength="1" />
  </svg>

  <span class="logo-text">Diseño Multimedia</span>
  <span class="sr">Cargando…</span>
</div>

</body>
</html>
